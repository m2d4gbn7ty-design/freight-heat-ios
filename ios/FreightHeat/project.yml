# =============================================================================
# FreightHeat · XcodeGen 工程描述
# -----------------------------------------------------------------------------
# 为什么用 XcodeGen 而不是直接提交 .xcodeproj：
#   .xcodeproj 是二进制化的 plist 工程文件，手写极易出现「能打开但构建失败」
#   的隐性错误，而当前环境（Windows）无法用 Xcode 验证。用 project.yml 生成，
#   在 macOS 上一条命令即可得到一份结构正确、可编译的工程。
#
# 生成方法（需要先安装 XcodeGen：brew install xcodegen）：
#   cd ios/FreightHeat
#   xcodegen generate
#   open FreightHeat.xcodeproj
# =============================================================================

name: FreightHeat

options:
  bundleIdPrefix: com.freightheat
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.30.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    CODE_SIGN_STYLE: Automatic

targets:
  FreightHeat:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: FreightHeatApp.swift
      - path: WebView.swift
      - path: AssetSchemeHandler.swift
      - path: LocalHTTPServer.swift
      - path: WebAssetLocator.swift
      - path: Assets.xcassets
      - path: Info.plist
        buildPhase: none
      # ios/www 以「文件夹引用」方式打包，Bundle 内保持 www/index.html 结构不变，
      # 与 AssetSchemeHandler / LocalHTTPServer 的路径假设一一对应。
      - path: ../www
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: FreightHeat
        PRODUCT_BUNDLE_IDENTIFIER: com.freightheat.ios
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "12.4.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

    dependencies:
      - sdk: WebKit.framework
      - sdk: Network.framework

schemes:
  FreightHeat:
    build:
      targets:
        FreightHeat: all
    run:
      config: Debug
    archive:
      config: Release
